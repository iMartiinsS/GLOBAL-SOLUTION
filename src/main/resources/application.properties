spring.application.name=alagalerta-api
server.port=${PORT:8080}

# ---------- Banco ----------
# Padrão: H2 em memória (roda sem instalar nada). Para PostgreSQL use o profile "postgres".
spring.datasource.url=${DB_URL:jdbc:h2:mem:alagalerta;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Paginação: página começa em 0, máximo 100 itens
spring.data.web.pageable.max-page-size=100

# ---------- Segurança ----------
# Defina JWT_SECRET (>= 32 caracteres) em produção. Sem ele a API gera uma chave aleatória a cada start.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ORIGINS:*}
# Carrega regiões, sensores, leituras e usuários de teste ao subir
app.seed.enabled=${SEED_ENABLED:true}

# ---------- Cache ----------
spring.cache.type=simple
spring.cache.cache-names=regioes,alertasAtivos

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.nome=AlagAlerta API
info.app.descricao=CitizenTech de alerta de enchentes - Global Solution FIAP 2026/2
info.app.versao=1.0.0
info.app.ods=11 - Cidades sustentaveis; 13 - Acao contra a mudanca do clima

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
